spring.application.name=expense-assistant
server.port=${PORT:8080}

# ---- MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- File upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# ---- OCR ----
tesseract.datapath=${TESSERACT_DATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
tesseract.language=eng
ocr.threshold=false
ocr.pdf.max-pages=3

# ---- Gemini ----
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-3.1-flash-lite
gemini.fallback-model=gemini-3.5-flash-lite

# ---- JWT (override JWT_SECRET with your own 32+ character value) ----
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
jwt.expiration-ms=86400000

# ---- Budget status threshold (percent used at which status becomes WARNING) ----
budget.warning-threshold=75

# ---- CORS ----
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
